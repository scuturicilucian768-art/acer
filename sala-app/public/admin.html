<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administrare sală</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<style>
body{min-height:100vh}
.lay{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.cols>*,.cols3>*,.kpis>*,.desk>*{min-width:0}
.alert .grow{min-width:0}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-family:var(--fd);font-weight:900;text-transform:uppercase;font-size:1.02rem}
.side .brand i{width:32px;height:32px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-style:normal}
.side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--muted);text-align:left;font-size:.94rem}
.side button .ic{opacity:.85}
.side .brand i .ic{opacity:1}
.side button.on{background:var(--card2);color:var(--ink)}
.side button.on .ic{color:var(--acc);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 70%,transparent))}
.side .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px}
.main{padding:26px 28px 80px;max-width:1240px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:2rem;line-height:1.05}
.ph p{margin:6px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi small{color:var(--muted);font-weight:700;font-size:.8rem}
.kpi b{display:block;font-family:var(--fd);font-size:2rem;line-height:1.15;margin-top:4px}
.kpi .d{font-size:.8rem;color:var(--muted)}
.kpi.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.code-big{font-family:var(--fd);font-weight:900;font-size:3.6rem;letter-spacing:.18em;color:var(--acc);line-height:1}
.alert{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .grow small{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;color:var(--faint);font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--card2)}
.av{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{max-width:320px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dayrow{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.dayrow .q{font-style:italic}
.ed-item{display:grid;grid-template-columns:2fr 70px 90px 80px 80px 36px;gap:6px;align-items:center;margin-bottom:6px}
.ed-meal{display:grid;grid-template-columns:1fr 80px 2fr 70px 60px 60px 60px 36px;gap:6px;align-items:center;margin-bottom:6px}
.ed-item .input,.ed-meal .input{padding:9px 10px;font-size:.88rem}
.pill-tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%;overflow:auto;margin-bottom:16px}
.pill-tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.pill-tabs button.on{background:var(--card2);color:var(--ink)}
.mtop{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.mtop .av{width:60px;height:60px;border-radius:18px;font-size:1.3rem;background:var(--acc);color:var(--acc-ink)}
.sheet.wide{width:760px}
.ok-box{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--green) 12%,transparent);border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}
.mob-top{display:none}
.main.stagger>*{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.kpi b{font-variant-numeric:tabular-nums}
.kpi .ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--acc);float:right}
.heat{display:grid;grid-template-columns:34px repeat(17,1fr);gap:3px;font-size:.66rem;color:var(--faint);font-weight:700}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--acc)}
.heat span{display:grid;place-items:center}
.desk{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.desk .qrbox svg{width:260px;height:260px}
.bigcode{font-family:var(--fd);font-weight:900;font-size:4.6rem;letter-spacing:.2em;color:var(--acc);line-height:1;text-align:center}
.fs{position:fixed;inset:0;z-index:300;background:#0A0A0C;display:grid;place-content:center;justify-items:center;gap:26px;text-align:center;padding:30px}
.fs .qrbox svg{width:min(52vh,70vw);height:min(52vh,70vw)}
.fs .bigcode{font-size:min(14vh,16vw)}
.inbox{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 150px);min-height:480px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.thr{border-right:1px solid var(--line);overflow:auto}
.thr button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;cursor:pointer}
.thr button.on{background:var(--card2)}
.thr button .grow small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.thr .u{min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-size:.7rem;font-weight:900;display:grid;place-items:center;padding:0 6px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:75%;padding:10px 14px;border-radius:18px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.bub.m{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub.g{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px}
.bub time{display:block;font-size:.68rem;opacity:.6;margin-top:3px}
.cbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cbar textarea{flex:1;min-height:46px;max-height:120px;resize:none}
.qr-reply{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none}
.qr-reply .btn{flex:none}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk .dcol{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:150px}
.wk .dcol.td{border-color:var(--acc)}
.wk .dh{font-size:.74rem;font-weight:800;color:var(--muted);text-transform:capitalize;margin-bottom:6px}
.wk .bk{font-size:.74rem;padding:6px 8px;border-radius:9px;margin-bottom:5px;background:var(--card2);border-left:3px solid var(--faint);cursor:pointer}
.wk .bk.pending{border-color:var(--amber)}.wk .bk.confirmed{border-color:var(--green)}.wk .bk.done{opacity:.55}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:var(--green)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media(max-width:900px){
  .lay{grid-template-columns:minmax(0,1fr)}
  .alert{flex-wrap:wrap}
  .side{position:fixed;inset:0 30% 0 0;z-index:90;transform:translateX(-100%);transition:transform .25s;height:100%}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
  .mob-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .main{padding:18px 16px 80px}
  .cols,.cols3{grid-template-columns:1fr}
  .tbl .hm{display:none}
  .dayrow{grid-template-columns:1fr}
  .ed-item{grid-template-columns:1fr 60px 70px;}
  .ed-meal{grid-template-columns:1fr 1fr}
  .desk{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr;height:auto}
  .inbox.open .thr{display:none}
  .inbox:not(.open) .conv{display:none}
  .conv{height:72vh}
  .conv .hd .chip,.conv .hd small{display:none}
  .wk{grid-template-columns:repeat(7,minmax(110px,1fr));overflow-x:auto}
}
</style>
</head>
<body>
<div id="login" class="hide"></div>
<div id="app" class="hide">
  <div class="mob-top"><button class="iconbtn" id="menu" aria-label="Meniu"></button><b id="mtitle" style="font-family:var(--fd)"></b></div>
  <div class="lay">
    <nav class="side" id="side">
      <div class="brand"><i id="bl"></i><span id="gn"></span></div>
      <button data-p="dash" data-i="grid">Panou</button>
      <button data-p="desk" data-i="qr">Recepție</button>
      <button data-p="members" data-i="users">Membri</button>
      <button data-p="chat" data-i="chat">Mesaje<em class="bd hide" id="chb"></em></button>
      <button data-p="payments" data-i="wallet">Plăți și restanțe</button>
      <button data-p="reports" data-i="chart">Rapoarte</button>
      <button data-p="notify" data-i="bell">Notificări</button>
      <button data-p="daily" data-i="spark">Motivația zilei</button>
      <button data-p="programs" data-i="dumbbell">Antrenamente</button>
      <button data-p="nutrition" data-i="food">Nutriție</button>
      <button data-p="pt" data-i="calendar">Antrenor personal<em class="bd hide" id="ptb"></em></button>
      <button data-p="ann" data-i="megaphone">Anunțuri</button>
      <button data-p="rewards" data-i="gift">Premii</button>
      <button data-p="settings" data-i="settings">Setări</button>
      <div style="flex:1"></div>
      <a class="btn btn-ghost btn-sm" href="app.html" target="_blank" rel="noopener" style="margin:6px" id="appL"></a>
      <button id="logout" data-i="logout" style="color:var(--faint)">Ieși</button>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>
<script src="core.js?v=3"></script>
<script src="seed.js?v=3"></script>
<script src="env.js?v=3"></script>
<script src="common.js?v=3"></script>
<script src="fig.js?v=3"></script>
<script src="qr.js?v=3"></script>
<script>
let page = 'dash', O = null, CFG = null;
$$('.side [data-i]').forEach((b) => b.insertAdjacentHTML('afterbegin', IC(b.dataset.i, 20)));
$('#bl').innerHTML = IC('bolt', 18); $('#menu').innerHTML = IC('grid', 20); $('#appL').innerHTML = IC('phone', 16) + ' Aplicația membrilor';
const M = () => $('#main');
const stateChip = (r) => r.state === 'active' ? '<span class="chip ok">Activ</span>' : r.state === 'expiring' ? `<span class="chip warn">Expiră ${r.daysLeft === 0 ? 'azi' : `în ${r.daysLeft} ${r.daysLeft === 1 ? 'zi' : 'zile'}`}</span>` : r.state === 'expired' ? '<span class="chip bad">Expirat</span>' : '<span class="chip">Fără abonament</span>';
const ini = (n) => String(n || '?').split(' ').map((x) => x[0]).join('').slice(0, 2).toUpperCase();
const idleTxt = (r) => r.idle == null ? 'n-a venit niciodată' : r.idle === 0 ? 'azi' : r.idle === 1 ? 'ieri' : `acum ${r.idle} zile`;
const waTo = (phone, text) => waLink(String(phone).replace(/\D/g, '').replace(/^0/, '40'), text);
const S = () => CFG.settings;

async function boot() {
  CFG = await api('/api/config'); applyAccent(CFG.settings.accent);
  if (CFG.setup) return showSetup();
  const w = await api('/api/whoami'); if (w.role !== 'admin') return showLogin();
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#gn').textContent = S().name;
  go(location.hash.slice(1) || 'dash');
}
function showSetup() {
  $('#app').classList.add('hide'); const L = $('#login'); L.classList.remove('hide');
  L.innerHTML = `<div class="login"><form class="card" id="sf" style="max-width:460px"><div style="width:56px;height:56px;border-radius:16px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-bottom:16px">${IC('bolt', 28)}</div><h1 style="font-size:1.8rem">Bun venit!</h1><p class="muted" style="margin:6px 0 20px">Configurează sala în 1 minut. Restul (prețuri, program, culori) le schimbi oricând din Setări.</p>
    <div class="field"><label for="s1">Numele sălii *</label><input class="input" id="s1" required autocomplete="organization"></div>
    <div class="g2"><div class="field"><label for="s2">Telefon</label><input class="input" id="s2" type="tel" placeholder="07xx xxx xxx"></div><div class="field"><label for="s3">WhatsApp</label><input class="input" id="s3" type="tel" placeholder="același ca telefonul"></div></div>
    <div class="field"><label for="s4">Adresa</label><input class="input" id="s4" autocomplete="street-address"></div>
    <div class="g2"><div class="field"><label for="s5">Parola panoului *</label><input class="input" id="s5" type="password" minlength="6" required autocomplete="new-password"></div><div class="field"><label for="s6">Repetă parola *</label><input class="input" id="s6" type="password" required autocomplete="new-password"></div></div>
    <p class="err" id="se"></p><button class="btn btn-acc btn-block">Pornește aplicația</button></form></div>`;
  $('#sf').onsubmit = async (e) => {
    e.preventDefault(); $('#se').textContent = '';
    if ($('#s5').value !== $('#s6').value) return ($('#se').textContent = 'Parolele nu sunt la fel.');
    try { await api('/api/setup', { method: 'POST', body: { name: $('#s1').value, phone: $('#s2').value, whatsapp: $('#s3').value, address: $('#s4').value, password: $('#s5').value } }); CFG = await api('/api/config'); applyAccent(CFG.settings.accent); toast('Sala e gata! Adaugă primii membri.'); boot(); }
    catch (er) { $('#se').textContent = er.message; }
  };
}
function showLogin() {
  $('#app').classList.add('hide'); const L = $('#login'); L.classList.remove('hide');
  L.innerHTML = `<div class="login"><form class="card" id="lf"><div style="width:56px;height:56px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font-size:1.6rem;margin-bottom:16px">⚡</div><h1 style="font-size:1.8rem">Administrare</h1><p class="muted" style="margin:6px 0 20px">${esc(CFG.settings.name)}</p>
    <div class="field"><label>Parola</label><input class="input" type="password" id="pw" autocomplete="current-password" required></div><p class="err" id="le"></p><button class="btn btn-acc btn-block">Intră</button>${window.GymDemo ? '<p class="tip" style="margin-top:14px">Demo: parola <b>admin</b></p>' : ''}</form></div>`;
  $('#lf').onsubmit = async (e) => { e.preventDefault(); try { await api('/api/admin/login', { method: 'POST', body: { password: $('#pw').value } }); boot(); } catch (er) { $('#le').textContent = er.message; } };
}
const TITLES = { dash: 'Panou', desk: 'Recepție', chat: 'Mesaje', reports: 'Rapoarte', members: 'Membri', payments: 'Plăți și restanțe', notify: 'Notificări', daily: 'Motivația zilei', programs: 'Antrenamente', nutrition: 'Nutriție', pt: 'Antrenor personal', ann: 'Anunțuri', rewards: 'Premii', settings: 'Setări' };
function go(p) {
  page = TITLES[p] ? p : 'dash'; history.replaceState(null, '', '#' + page);
  $$('.side [data-p]').forEach((b) => b.classList.toggle('on', b.dataset.p === page)); $('#mtitle').textContent = TITLES[page]; $('#side').classList.remove('open');
  M().innerHTML = '<div class="skel" style="height:60px;margin-bottom:14px"></div><div class="skel" style="height:220px"></div>'; M().classList.remove('stagger'); clearInterval(window._poll); window._quiet = null; window._convReload = null; stopScan();
  const fn = ({ dash: pDash, desk: pDesk, chat: pChat, reports: pReports, members: pMembers, payments: pPayments, notify: pNotify, daily: pDaily, programs: pPrograms, nutrition: pNutrition, pt: pPT, ann: pAnn, rewards: pRewards, settings: pSettings })[page];
  fn().then(() => { M().classList.add('stagger'); countUp(M()); if (!window._quiet && ['dash', 'members', 'payments', 'pt', 'rewards'].includes(page)) window._quiet = async () => { await fn(); countUp(M()); }; }).catch((e) => { if (e.status === 401) return showLogin(); M().innerHTML = `<p class="err">${esc(e.message)}</p>`; });
  scrollTo(0, 0);
}
$$('.side [data-p]').forEach((b) => (b.onclick = () => go(b.dataset.p)));
$('#menu').onclick = () => $('#side').classList.toggle('open');
$('#logout').onclick = async () => { await api('/api/logout', { method: 'POST', body: {} }); showLogin(); };
document.addEventListener('click', (e) => { if ($('#side').classList.contains('open') && !e.target.closest('#side') && !e.target.closest('#menu')) $('#side').classList.remove('open'); });

/* ───────── PANOU ───────── */
async function pDash() {
  O = await api('/api/admin/overview'); const s = O.stats; updBadges();
  $('#ptb').textContent = O.bookings.filter((b) => b.status === 'pending').length || ''; $('#ptb').classList.toggle('hide', !O.bookings.some((b) => b.status === 'pending'));
  const al = (r, kind) => `<div class="alert"><span class="av">${esc(ini(r.name))}</span><div class="grow"><b>${esc(r.name)}</b><br><small>${kind === 'exp' ? (r.state === 'expired' ? `expirat din ${fdate(r.end)}` : `expiră ${r.daysLeft === 0 ? 'azi' : `pe ${fdate(r.end)}`}`) + ` · ${esc(r.plan || '')}` : `ultima vizită ${idleTxt(r)}`}</small></div>
    <a class="btn btn-sm" href="${waTo(r.phone, kind === 'exp' ? `Bună, ${r.name.split(' ')[0]}! Abonamentul tău la ${S().name} ${r.state === 'expired' ? 'a expirat' : 'expiră ' + (r.daysLeft === 0 ? 'azi' : 'pe ' + fdate(r.end))}. Te așteptăm să-l reînnoiești! 💪` : `Bună, ${r.name.split(' ')[0]}! Nu te-am mai văzut de ceva vreme la sală. Totul e ok? Te așteptăm! 💪`)}" target="_blank" rel="noopener">${IC('chat', 16)}</a>
    ${kind === 'exp' ? `<button class="btn btn-sm btn-acc" data-pay="${r.id}">Încasează</button>` : `<button class="btn btn-sm" data-open="${r.id}">Vezi</button>`}</div>`;
  M().innerHTML = `<div class="ph"><div><h1>Bună ziua! 👋</h1><p>${esc(fday(todayStr()))} · ${s.visitsToday} ${s.visitsToday === 1 ? 'vizită' : 'vizite'} azi</p></div><div class="row" style="gap:8px"><button class="btn btn-acc" id="nm">+ Membru nou</button><button class="btn" id="nn">🔔 Trimite notificare</button></div></div>
    <div class="kpis">
      <div class="kpi hl"><span class="ki">${IC('users', 18)}</span><small>Membri activi</small><b data-count="${s.active}">0</b><span class="d">din ${s.total} înscriși</span></div>
      <div class="kpi"><span class="ki">${IC('wallet', 18)}</span><small>Venit luna asta</small><b><span data-count="${s.revenueMonth}">0</span> lei</b><span class="d">${s.revenue[4] ? `luna trecută ${lei(s.revenue[4].total)}` : ''}</span></div>
      <div class="kpi"><span class="ki">${IC('plus', 18)}</span><small>Membri noi</small><b data-count="${s.newThisMonth}">0</b><span class="d">luna asta</span></div>
      <div class="kpi"><span class="ki">${IC('check', 18)}</span><small>Reînnoiri</small><b data-count="${s.renewals}">0</b><span class="d">luna asta</span></div>
      <div class="kpi"><span class="ki" style="color:var(--red)">${IC('logout', 18)}</span><small>Abandon</small><b style="color:${s.churnRate > 15 ? 'var(--red)' : 'inherit'}">${s.churnRate}%</b><span class="d">${s.churn} au expirat în ultimele 30 de zile</span></div>
    </div>
    <div class="cols">

    O = await api('/api/admin/overview'); drawToday(O); $('#dq').value = ''; $('#dres').innerHTML = '';
  };
  let h; $('#dq').oninput = (e) => { clearTimeout(h); const q = e.target.value.trim(); if (!q) { $('#dres').innerHTML = ''; return; } h = setTimeout(async () => { const { members } = await api('/api/admin/members?q=' + encodeURIComponent(q)); $('#dres').innerHTML = members.slice(0, 6).map((r) => `<div class="alert"><span class="av">${esc(ini(r.name))}</span><div class="grow"><b>${esc(r.name)}</b><br><small>${esc(r.phone)} · ${r.end ? 'expiră ' + fdate(r.end) : 'fără abonament'}</small></div>${stateChip(r)}<button class="btn btn-sm btn-acc" data-ci="${r.id}">${IC('check', 16)} Check-in</button></div>`).join('') || '<p class="muted">Niciun membru găsit.</p>'; $$('[data-ci]').forEach((b) => (b.onclick = () => doCI(b.dataset.ci))); }, 180); };
  $('#fs2').onclick = showFull;
  $('#nc2').onclick = async () => { if (!(await ask('Generezi un cod nou?', 'Codul vechi nu mai merge. Membrii vor folosi noul cod.', 'Cod nou', { icon: 'timer' }))) return; await api('/api/admin/checkin-code', { method: 'POST', body: {} }); pDesk(); };
  if ($('#scan')) $('#scan').onclick = async () => {
    if (camS) { stopScan(); $('#camB').innerHTML = ''; return; }
    try {
      camS = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); $('#camB').innerHTML = '<video playsinline muted autoplay style="width:100%;border-radius:14px;margin-top:10px;background:#000"></video>';
      const v = $('#camB video'); v.srcObject = camS; const det = new BarcodeDetector({ formats: ['qr_code'] });
      const loop = async () => { if (!camS || !document.body.contains(v)) return stopScan(); try { const r = await det.detect(v); const m = r[0] && /^GYM:(\w+)$/.exec(r[0].rawValue); if (m) { await doCI(m[1]); await new Promise((ok) => setTimeout(ok, 2500)); } } catch {} setTimeout(loop, 300); };
      loop();
    } catch { $('#camB').innerHTML = '<p class="err">Nu am acces la cameră.</p>'; }
  };
  window._quiet = async () => { const o = await api('/api/admin/overview'); O = o; drawToday(o); updBadges(); };
  if (!window.GymDemo) window._poll = setInterval(() => window._quiet().catch(() => {}), 15000);
}

/* ───────── MESAJE ───────── */
let chatSel = null;
const QUICK = ['Bună! Mulțumim pentru mesaj, revenim imediat.', 'Sigur, te așteptăm!', 'Programul de azi este 06:00 – 22:00.', 'Abonamentul se poate plăti cash sau cu cardul la recepție.'];
async function pChat() {
  M().innerHTML = `<div class="ph"><div><h1>Mesaje</h1><p>Conversațiile cu membrii din aplicație. Când răspunzi, membrul primește notificare pe telefon.</p></div><button class="btn btn-acc" id="nw">${IC('plus', 18)} Conversație nouă</button></div><div class="inbox ${chatSel ? 'open' : ''}" id="ib"><div class="thr" id="thr"></div><div class="conv" id="conv"><div class="muted" style="margin:auto;text-align:center;padding:40px">${IC('chat', 40)}<p>Alege o conversație</p></div></div></div>`;
  const drawThreads = async () => {
    const { threads } = await api('/api/admin/chats'); O = O || (await api('/api/admin/overview'));
    $('#thr').innerHTML = threads.map((t) => `<button data-t="${t.id}" class="${t.id === chatSel ? 'on' : ''}"><span class="av">${esc(ini(t.name))}</span><span class="grow"><b>${esc(t.name)}</b><small>${t.from === 'g' ? 'Tu: ' : ''}${esc(t.last)}</small></span><span style="display:grid;justify-items:end;gap:4px"><small class="muted" style="font-size:.7rem">${new Date(t.at).toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' })}</small>${t.unread ? `<span class="u">${t.unread}</span>` : ''}</span></button>`).join('') || '<p class="muted" style="padding:16px">Nicio conversație încă.</p>';
    $$('#thr [data-t]').forEach((b) => (b.onclick = () => openConv(b.dataset.t)));
    O.chatUnread = threads.reduce((a, t) => a + t.unread, 0); updBadges();
    return threads;
  };
  const openConv = async (id) => {
    chatSel = id; $('#ib').classList.add('open'); $$('#thr [data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === id));
    const r = await api('/api/admin/chats/' + id), mm = r.member;
    $('#conv').innerHTML = `<div class="hd"><button class="iconbtn" id="bk" aria-label="Înapoi" style="${matchMedia('(max-width:900px)').matches ? '' : 'display:none'}">${IC('back', 18)}</button><span class="av">${esc(ini(mm.name))}</span><div class="grow"><b>${esc(mm.name)}</b><br><small class="muted">${esc(mm.phone)} · ${esc(mm.plan || 'fără abonament')}</small></div>${stateChip(mm)}<button class="btn btn-sm" id="om" aria-label="Fișa membrului">${IC('user', 16)}</button></div>
      <div class="msgs" id="cm"></div><div class="qr-reply">${QUICK.map((q, i) => `<button class="btn btn-sm" data-q="${i}" style="font-weight:600">${esc(q.length > 34 ? q.slice(0, 32) + '…' : q)}</button>`).join('')}</div>
      <form class="cbar" id="cf"><textarea class="input" id="ct" placeholder="Scrie răspunsul…" aria-label="Răspuns"></textarea><button class="btn btn-acc" aria-label="Trimite" style="width:52px;padding:0">${IC('send', 20)}</button></form>`;
    const draw = (msgs) => { let last = ''; $('#cm').innerHTML = msgs.map((m) => { const d = m.at.slice(0, 10), sep = d !== last ? `<div style="align-self:center;font-size:.72rem;color:var(--faint);font-weight:700;margin:8px 0 2px">${fday(d)}</div>` : ''; last = d; return `${sep}<div class="bub ${m.from}">${esc(m.text)}<time>${new Date(m.at).toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' })}</time></div>`; }).join('') || '<p class="muted" style="margin:auto">Scrie primul mesaj.</p>'; $('#cm').scrollTop = 1e9; };
    draw(r.messages); drawThreads();
    $$('[data-q]').forEach((b) => (b.onclick = () => { $('#ct').value = QUICK[+b.dataset.q]; $('#ct').focus(); }));
    $('#ct').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
    $('#cf').onsubmit = async (e) => { e.preventDefault(); const tx = $('#ct').value.trim(); if (!tx) return; $('#ct').value = ''; try { const r2 = await api('/api/admin/chats/' + id, { method: 'POST', body: { text: tx } }); draw(r2.messages); drawThreads(); } catch (er) { toast(er.message, 'bad'); $('#ct').value = tx; } };
    $('#bk').onclick = () => { chatSel = null; $('#ib').classList.remove('open'); };
    $('#om').onclick = () => openMember(id);
    window._convReload = async () => { if (chatSel !== id || !$('#cm')) return; const x = await api('/api/admin/chats/' + id); draw(x.messages); };
  };
  const threads = await drawThreads();
  if (chatSel) openConv(chatSel); else if (threads[0] && !matchMedia('(max-width:900px)').matches) openConv(threads.find((t) => t.unread) ? threads.find((t) => t.unread).id : threads[0].id);
  $('#nw').onclick = async () => {
    const { members } = await api('/api/admin/members');
    const el = sheet(`<h2>Conversație nouă</h2><div class="field" style="margin-top:12px"><label for="cs">Membru</label><input class="input" id="cs" placeholder="Caută…" autocomplete="off"></div><div class="list" id="cr" style="gap:0;max-height:50vh;overflow:auto"></div>`);
    const draw = () => { const q = $('#cs', el).value.toLowerCase(); $('#cr', el).innerHTML = members.filter((x) => !q || x.name.toLowerCase().includes(q)).slice(0, 30).map((x) => `<button class="alert" data-m="${x.id}" style="background:none;border-left:0;border-right:0;border-top:0;color:inherit;cursor:pointer;text-align:left;width:100%"><span class="av">${esc(ini(x.name))}</span><span class="grow"><b>${esc(x.name)}</b><br><small>${esc(x.phone)}</small></span></button>`).join(''); $$('[data-m]', el).forEach((b) => (b.onclick = () => { closeSheet(); openConv(b.dataset.m); })); };
    $('#cs', el).oninput = draw; draw(); $('#cs', el).focus();
  };
  window._quiet = async () => { await drawThreads(); if (window._convReload) await window._convReload(); };
  if (!window.GymDemo) window._poll = setInterval(() => window._quiet().catch(() => {}), 8000);
}

/* ───────── RAPOARTE ───────── */
async function pReports() {
  O = await api('/api/admin/overview'); updBadges(); const r = O.reports, s = O.stats;
  const v30 = r.visits30.reduce((a, x) => a + x.n, 0), hmax = Math.max(1, ...r.heat.flat());
  const DN = ['Lun', 'Mar', 'Mie', 'Joi', 'Vin', 'Sâm', 'Dum'];
  M().innerHTML = `<div class="ph"><div><h1>Rapoarte</h1><p>Cum evoluează sala: membri, bani, prezență și orele aglomerate.</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="xm">${IC('download', 18)} Membri (Excel)</button><button class="btn" id="xp">${IC('download', 18)} Plăți luna asta</button></div></div>
    <div class="kpis"><div class="kpi hl"><small>Membri înscriși</small><b data-count="${s.total}">0</b><span class="d">${s.active} cu abonament activ</span></div><div class="kpi"><small>Vizite în 30 de zile</small><b data-count="${v30}">0</b><span class="d">~${Math.round(v30 / 30)} pe zi</span></div><div class="kpi"><small>Venit mediu pe membru</small><b><span data-count="${r.ltv}">0</span> lei</b><span class="d">de la înscriere până azi</span></div><div class="kpi"><small>Venit pe 6 luni</small><b><span data-count="${s.revenue.reduce((a, x) => a + x.total, 0)}">0</span> lei</b><span class="d">${s.revenue.reduce((a, x) => a + x.count, 0)} plăți</span></div></div>
    <div class="cols"><div class="card"><h3>Creșterea numărului de membri</h3><p class="muted small" style="margin:2px 0 8px">Total înscriși la final de lună, ultimele 12 luni</p>${lineChart(r.growth.map((x) => ({ v: x.total, l: MONTHS[+x.month.slice(5) - 1] })), { h: 220, label: 'Membri', min: 0 })}</div>
      <div class="card"><h3>Abonamente active pe tip</h3><div style="margin-top:14px">${donut(r.mix.map((x) => ({ l: x.name, v: x.n })), { sub: 'activi', label: 'Abonamente' })}</div></div></div>
    <div class="cols"><div class="card"><h3>Venituri pe luni</h3>${barChart(s.revenue.map((x) => ({ v: x.total, l: MONTHS[+x.month.slice(5) - 1] })), { fmt: (v) => (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v), label: 'Venituri' })}</div>
      <div class="card"><h3>Membri noi pe luni</h3>${barChart(r.growth.slice(-6).map((x) => ({ v: x.added, l: MONTHS[+x.month.slice(5) - 1] })), { label: 'Membri noi' })}</div></div>
    <div class="card" style="margin-top:14px"><div class="row" style="flex-wrap:wrap"><div class="grow"><h3>Orele aglomerate</h3><p class="muted small" style="margin:2px 0 12px">Check-in-uri din ultimele 8 săptămâni, pe zile și ore. Bun pentru programarea antrenorilor și a curățeniei.</p></div></div>
      <div style="overflow-x:auto"><div class="heat" style="min-width:560px"><span></span>${Array.from({ length: 17 }, (_, i) => `<span>${6 + i}</span>`).join('')}${r.heat.map((row, d) => `<span>${DN[d]}</span>${row.map((n, hh) => `<i title="${DN[d]} ${6 + hh}:00 · ${n} check-in" style="opacity:${n ? 0.12 + (n / hmax) * 0.88 : 0.05}"></i>`).join('')}`).join('')}</div></div></div>
    <div class="cols"><div class="card"><h3>Vizite în ultimele 30 de zile</h3>${barChart(r.visits30.map((x, i) => ({ v: x.n, l: i % 5 === 0 || i === 29 ? String(+x.date.slice(8)) : '' })), { label: 'Vizite', fmt: () => '' })}</div>
      <div class="card"><h3>Cei mai activi (30 de zile)</h3>${r.top.map((x, i) => `<div class="alert"><span class="av" style="${i === 0 ? 'background:linear-gradient(140deg,#FFD66B,#E9A100);color:#2a1a00' : ''}">${i + 1}</span><div class="grow"><b>${esc(x.name)}</b></div><b>${x.n} vizite</b></div>`).join('')}</div></div>`;
  $('#xm').onclick = exportMembers; $('#xp').onclick = () => exportPayments(todayStr().slice(0, 7));
}

if (window.GymDemo) window.GymDemoRefresh = () => { if ($('#sheet') || $('.fs') || $('#app').classList.contains('hide')) return; if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !window._quiet) return; (window._quiet ? window._quiet() : go(page)); };
boot().catch((e) => { document.body.innerHTML = `<p style="padding:30px">${esc(e.message)}</p>`; });
</script>
</body>
