<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala mea</title>
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Fraunces:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<style>
body{background:radial-gradient(120% 60% at 100% -10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
/* splash */
#splash{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .45s,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite;overflow:hidden}
#splash .lg img{width:100%;height:100%;object-fit:cover}
#splash b{font-family:var(--fd);font-weight:900;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent);transform:scale(1)}60%{box-shadow:0 0 0 26px transparent;transform:scale(1.04)}100%{box-shadow:0 0 0 0 transparent;transform:scale(1)}}
/* antet */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:900;font-size:clamp(.82rem,3.9vw,1.05rem);text-transform:uppercase;letter-spacing:.01em;flex:1;min-width:0}
.brand i{width:36px;height:36px;border-radius:11px;background:#000;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
/* bara de jos */
.tabs{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,#1A1A20 82%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line2);border-radius:26px;padding:6px;box-shadow:0 20px 40px -12px rgba(0,0,0,.8)}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:color-mix(in srgb,var(--acc) 14%,transparent);transition:transform .45s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tabs button{position:relative;border:0;background:none;color:var(--faint);display:grid;justify-items:center;gap:3px;padding:8px 2px 6px;font-size:.66rem;font-weight:800;letter-spacing:.02em;cursor:pointer;border-radius:20px;transition:color .25s}
.tabs button .ic{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.tabs button.on{color:var(--acc)}
.tabs button.on .ic{transform:translateY(-1px) scale(1.12)}
.hello{padding:14px 0 10px}
.hello small{color:var(--muted);font-weight:600;text-transform:capitalize}
.hello h1{font-size:2.05rem;line-height:1.04;margin-top:4px;text-wrap:balance}
/* card de membru 3D */
.mc3{perspective:1200px;cursor:pointer;-webkit-user-select:none;user-select:none}
.mc-in{position:relative;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;min-height:206px}
.mc3.flip .mc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line2)}
.mc-f{background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--acc) 34%,transparent) 0%,transparent 55%),linear-gradient(140deg,#24242C 0%,#121217 70%)}
.mc-f::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.mc-f.exp{background:radial-gradient(120% 120% at 100% 0%,rgba(255,90,110,.32),transparent 55%),linear-gradient(140deg,#24242C,#121217 70%)}
.mc-f.warn{background:radial-gradient(120% 120% at 100% 0%,rgba(255,194,61,.3),transparent 55%),linear-gradient(140deg,#24242C,#121217 70%)}
.mc-top{display:flex;align-items:center;gap:10px;position:relative}
.mc-top b{font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:.86rem;flex:1}
.mc-logo{width:30px;height:30px;border-radius:9px;background:#000;display:grid;place-items:center;overflow:hidden;flex:none}
.mc-mid{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.mc-mid .k{font-size:.7rem;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.mc-mid .plan{font-family:var(--fd);font-size:1.55rem;font-weight:900;line-height:1.1;margin-top:2px}
.mc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative;font-size:.8rem}
.mc-bot .nm{font-family:var(--fd);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
.mc-hint{color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:700}
.mc-b{transform:rotateY(180deg);background:linear-gradient(160deg,#F4F4F6,#DADAE0);color:#0A0A0C;flex-direction:row;align-items:center;gap:16px}
.mc-b .qrbox{padding:8px;border-radius:14px;margin:0}
.mc-b .qrbox svg{width:150px;height:150px}
.mc-b b{font-family:var(--fd);font-size:1.15rem;display:block;line-height:1.15}
.mc-b small{color:#55555F;font-weight:600}
.mc3 .ring .ring-t b{font-size:1.6rem}
/* acțiuni rapide */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{position:relative;display:grid;justify-items:center;gap:7px;padding:12px 4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.74rem;font-weight:800;transition:transform .15s}
.qa button:active{transform:scale(.95)}
.qa .q{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--card2)}
.qa button:first-child .q{background:var(--acc);color:var(--acc-ink)}
.qa button.done .q{background:rgba(61,220,151,.16);color:var(--green)}
.qa .bd{position:absolute;top:6px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:.66rem;display:grid;place-items:center}
/* serie + săptămână */
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:10px}
.streak{position:relative;overflow:hidden;border-radius:22px;padding:16px;background:linear-gradient(150deg,rgba(255,122,61,.22),var(--card) 60%);border:1px solid var(--line)}
.streak .fl{color:#FF8A3D;filter:drop-shadow(0 0 10px rgba(255,138,61,.6))}
.streak b{font-family:var(--fd);font-size:2.4rem;line-height:1}
.wd{display:flex;gap:5px;margin-top:12px}
.wd span{flex:1;display:grid;justify-items:center;gap:4px;font-size:.62rem;font-weight:800;color:var(--faint)}
.wd i{width:100%;max-width:22px;aspect-ratio:1;border-radius:7px;background:var(--card2);display:grid;place-items:center}
.wd i.on{background:#FF8A3D;color:#1a0a00}
.wd i.td{outline:2px solid var(--ink);outline-offset:1px}
.weekc{border-radius:22px;padding:14px;background:var(--card);border:1px solid var(--line);display:grid;justify-items:center;align-content:center;gap:6px;text-align:center}
.weekc small{color:var(--muted);font-weight:700;font-size:.74rem}
/* aglomerație */
.crowd{position:relative;overflow:hidden}
.crowd .dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite;color:var(--green);flex:none}
.crowd.lv2 .dot{background:var(--amber);color:var(--amber)}.crowd.lv3 .dot{background:var(--red);color:var(--red)}.crowd.lv0 .dot{background:var(--faint);color:var(--faint);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}80%,100%{box-shadow:0 0 0 12px transparent}}
.crowd small{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.crowd .lvl{font-family:var(--fd);font-size:1.3rem;display:block}
.hb{display:flex;align-items:flex-end;gap:3px;height:62px;margin-top:14px}
.hb i{flex:1;background:var(--card2);border-radius:5px 5px 2px 2px;position:relative;min-height:4px}
.hb i.on{background:var(--acc)}
.hb em{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.58rem;color:var(--faint);font-weight:700}
/* motivație */
.quote{position:relative;border-radius:24px;padding:22px 20px;background:linear-gradient(160deg,color-mix(in srgb,var(--vio) 34%,var(--card)) 0%,var(--card) 72%);border:1px solid var(--line2);overflow:hidden}
.quote::before{content:"„";position:absolute;right:10px;top:-34px;font:italic 600 9rem var(--fq);color:rgba(255,255,255,.06);line-height:1}
.quote .q{font-family:var(--fq);font-style:italic;font-size:1.32rem;line-height:1.3;position:relative}
.quote .a{color:var(--muted);font-size:.86rem;margin-top:8px}
.chal{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;color:inherit}
.chal .box{width:34px;height:34px;border-radius:11px;border:2.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:.25s cubic-bezier(.3,1.5,.5,1);color:transparent}
.chal.done .box{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);transform:scale(1.08) rotate(-6deg)}
.chal small{display:block;font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
.chal.done b{text-decoration:line-through;opacity:.7}
/* antrenamentul de azi */
.today{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;border-radius:24px;padding:16px 10px 16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 13%,var(--card)),var(--card) 70%);border:1px solid var(--line2)}
.today .k{font-size:.7rem;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.today h3{font-size:1.3rem;margin:4px 0 6px}
.figwrap{background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.06),transparent 70%);border-radius:18px}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;margin:6px 0 12px}
.podium div{display:grid;justify-items:center;gap:6px;text-align:center}
.podium .av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-family:var(--fd);font-weight:900;background:var(--card2)}
.podium .p1 .av{width:58px;height:58px;background:linear-gradient(140deg,#FFD66B,#E9A100);color:#2a1a00}
.podium .p2 .av{background:linear-gradient(140deg,#E8E8EE,#9A9AA8);color:#111}
.podium .p3 .av{background:linear-gradient(140deg,#F0A36B,#B8642A);color:#1f0d00}
.podium .st2{width:100%;border-radius:12px 12px 4px 4px;background:var(--card2);display:grid;place-items:center;font-family:var(--fd);font-weight:900;color:var(--muted)}
.podium small{font-size:.74rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.lbrow.me{background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.lbrow .n{width:26px;text-align:center;font-family:var(--fd);font-weight:900;color:var(--muted)}
/* diverse */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.st b{display:block;font-family:var(--fd);font-size:1.6rem;line-height:1.1}
.st small{color:var(--muted);font-size:.74rem;font-weight:700}
.next .ico{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.ann{border-left:4px solid var(--acc)}
.ann.oferta{border-color:var(--amber)}.ann.eveniment{border-color:var(--vio)}.ann.program{border-color:var(--green)}
.ann p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.contact a{display:grid;justify-items:center;gap:8px;padding:14px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:.82rem}
.contact a span{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card2);color:var(--acc)}
.banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));border:1px solid var(--line2);margin-bottom:12px}
.banner .bi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);flex:none}
/* antrenament */
.prog{border-radius:26px;padding:18px;background:radial-gradient(100% 100% at 100% 0%,color-mix(in srgb,var(--vio) 30%,transparent),transparent 60%),var(--card);border:1px solid var(--line2)}
.day{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;width:100%;color:inherit;text-align:left}
.day.next-up{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.day .n{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-family:var(--fd);font-weight:900;flex:none}
.day.next-up .n{background:var(--acc);color:var(--acc-ink)}
.ai{position:relative;overflow:hidden;border-radius:26px;padding:20px;background:linear-gradient(135deg,#2A1F5E 0%,#17171C 75%);border:1px solid rgba(139,108,255,.4)}
.ai::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(139,108,255,.55),transparent 65%);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translate(-20px,16px)}}
.ai .sp{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,#B6A2FF,#7C5CFF);color:#fff;position:relative}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exg{display:grid;gap:4px;padding:10px 12px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;transition:transform .15s,border-color .2s}
.exg:active{transform:scale(.97)}
.exg .fig{background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.05),transparent 70%);border-radius:12px;aspect-ratio:1}
.exg b{font-size:.9rem;line-height:1.25}
.exg small{color:var(--muted);font-size:.74rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:44px}
.stage{border-radius:22px;background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 65%),var(--card);border:1px solid var(--line);padding:6px;margin:4px 0 14px}
.stage .fig{max-height:250px}
.pr{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(255,194,61,.16),var(--card));border:1px solid var(--line)}
/* asistent program */
.wz-bar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin:6px 0 18px}
.wz-bar i{display:block;height:100%;background:linear-gradient(90deg,#7C5CFF,var(--acc));transition:width .4s}
.opts{display:grid;gap:10px}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;color:inherit;text-align:left;transition:.15s}
.opt:hover{border-color:var(--acc)}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none;color:var(--acc)}
.opt small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.opt.big{justify-content:center;font-family:var(--fd);font-weight:900;font-size:1.5rem;padding:18px}
.gen{display:grid;justify-items:center;gap:14px;padding:30px 0;text-align:center}
.gen .sp{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(140deg,#B6A2FF,#7C5CFF);color:#fff;animation:spin 1.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spin{50%{transform:rotate(180deg) scale(.9)}100%{transform:rotate(360deg)}}
/* antrenament activ */
.wo,.chat{position:fixed;inset:0;z-index:120;background:var(--bg);overflow:auto;animation:vin .3s}
.wo{padding-bottom:140px}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wo-top,.chat-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.wo-top .tm{font-family:var(--fd);font-weight:900;font-size:1.4rem;color:var(--acc);font-variant-numeric:tabular-nums}
.wex{margin:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.wex.all{border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.wex .th{width:58px;height:58px;flex:none;border-radius:14px;background:var(--bg2)}
.sets{display:grid;gap:8px;margin-top:12px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center}
.set .no{font-family:var(--fd);font-weight:900;color:var(--faint);text-align:center}
.set input{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:11px 8px;text-align:center;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.set .lb{font-size:.68rem;color:var(--faint);text-align:center;font-weight:700}
.set .ck{height:46px;border-radius:12px;border:2px solid var(--line2);background:var(--bg2);cursor:pointer;color:transparent;display:grid;place-items:center;transition:.2s}
.set.done .ck{background:var(--green);border-color:var(--green);color:#04130b}
.set.done input{opacity:.6}
.rest{white-space:nowrap;position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:130;display:flex;align-items:center;gap:12px;background:var(--ink);color:#000;padding:8px 8px 8px 14px;border-radius:999px;font-weight:900;box-shadow:var(--sh)}
.rest b{font-family:var(--fd);font-size:1.3rem;font-variant-numeric:tabular-nums}
.rest .rr{width:34px;height:34px;flex:none}
.rest .rr circle{fill:none;stroke-width:4}
.wo-end{position:fixed;left:0;right:0;bottom:0;z-index:125;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
/* chat */
.chat{display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px;max-width:640px;width:100%;margin:0 auto}
.bub{max-width:80%;padding:10px 14px;border-radius:20px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:rise .3s both}
.bub.g{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub.m{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-bottom-right-radius:6px;font-weight:500}
.bub time{display:block;font-size:.68rem;opacity:.6;margin-top:3px}
.dsep{align-self:center;font-size:.72rem;color:var(--faint);font-weight:700;margin:10px 0 4px}
.cbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);max-width:640px;width:100%;margin:0 auto}
.cbar textarea{flex:1;resize:none;min-height:46px;max-height:120px;border-radius:16px}
.cbar .btn{width:50px;padding:0;border-radius:16px}
/* progres */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:.7rem;color:var(--faint);font-weight:800}
.cal .d{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:.86rem;font-weight:700;background:var(--bg2);position:relative;color:var(--muted)}
.cal .d.w{background:var(--acc);color:var(--acc-ink)}
.cal .d.c{background:color-mix(in srgb,var(--acc) 40%,var(--card2));color:var(--ink)}
.cal .d.p::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--vio)}
.cal .d.t{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.o{opacity:.25}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:grid;justify-items:center;gap:4px;text-align:center;padding:12px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:inherit}
.bdg span{font-size:1.9rem;filter:grayscale(1);opacity:.3}
.bdg small{font-size:.66rem;font-weight:800;color:var(--faint);line-height:1.2}
.bdg.on{border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,var(--card)),var(--card))}
.bdg.on span{filter:none;opacity:1}.bdg.on small{color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos button{aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;position:relative;background:var(--card2)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos small{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:8px;font-size:.68rem;font-weight:700;color:#fff}
.photos .add{aspect-ratio:3/4;border-radius:14px;border:2px dashed var(--line2);display:grid;place-content:center;justify-items:center;gap:6px;cursor:pointer;text-align:center;color:var(--muted);font-weight:800;font-size:.84rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.mtab{width:100%;border-collapse:collapse;font-size:.9rem}
.mtab th,.mtab td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.mtab th{color:var(--faint);font-size:.72rem;font-weight:800}
.hero-pts{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 24%,var(--card)),var(--card));border:1px solid var(--line2)}
.hero-pts b{font-family:var(--fd);font-size:2.4rem;line-height:1}
.reward{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.goal{display:grid;gap:12px}
.goal .row small{color:var(--muted);font-weight:700}
/* nutriție */
.meal{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;color:inherit}
.meal .box{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;margin-top:2px;transition:.2s}
.meal.done{border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.meal.done .box{background:var(--green);border-color:var(--green);color:#04130b}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.macro b{font-family:var(--fd);font-size:1.2rem}
.macro div div{white-space:nowrap}
.macro span{font-size:.8rem}
.water{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.water button{aspect-ratio:3/4;border-radius:10px 10px 14px 14px;border:2px solid #2E5E8A;background:transparent;cursor:pointer;position:relative;overflow:hidden;padding:0}
.water button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#5FB8FF,#2E7DD1);transition:height .4s cubic-bezier(.3,1.3,.5,1)}
.water button.on::after{height:82%}
/* profil */
.avatar{width:74px;height:74px;border-radius:24px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:1.8rem;flex:none}
.menu{display:grid;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.menu button,.menu a{display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;background:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font-weight:600;text-decoration:none;color:inherit;width:100%}
.menu > :last-child{border-bottom:0}
.menu .mi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--acc);flex:none}
.menu .ar{margin-left:auto;color:var(--faint)}
.toggle{width:52px;height:30px;border-radius:30px;background:var(--card2);position:relative;flex:none;margin-left:auto;transition:.2s}
.toggle::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.toggle.on{background:var(--acc)}
.toggle.on::after{left:25px;background:var(--acc-ink)}
/* login */
.login{min-height:100vh;display:grid;align-content:center;padding:30px 20px;max-width:440px;margin:0 auto;position:relative}
.login .logo{width:170px;height:170px;border-radius:50%;margin:0 auto 14px;overflow:hidden;box-shadow:0 20px 60px -10px color-mix(in srgb,var(--acc) 45%,transparent)}
.login .logo img{width:100%;height:100%;object-fit:cover}
.login h1{font-size:2.6rem;line-height:1}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 9s ease-in-out infinite}
.code{display:flex;gap:10px;justify-content:center;margin:18px 0}
.code input{width:62px;height:72px;text-align:center;font-family:var(--fd);font-weight:900;font-size:2rem;border-radius:16px;background:var(--bg2);border:2px solid var(--line2);outline:none}
.code input:focus{border-color:var(--acc)}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1;max-width:320px;margin:12px auto}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:18%;border:3px solid var(--acc);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:.8rem;font-weight:700;margin:16px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:14px 0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:900;font-family:var(--fd)}
.tip{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);font-size:.94rem}
.notif{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.notif.new{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.notif p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.small{font-size:.84rem}
.hero-logo{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:14px auto 0;display:grid;place-items:center}
.hero-logo::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 38%,transparent) 0%,transparent 65%);animation:hlGlow 4s ease-in-out infinite}
.hl-ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,var(--acc) 50deg,transparent 110deg,transparent 200deg,color-mix(in srgb,var(--acc) 70%,#fff) 250deg,transparent 310deg);animation:hlSpin 6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.hl-img{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent),0 24px 60px -16px color-mix(in srgb,var(--acc) 55%,transparent);animation:hlIn .9s cubic-bezier(.2,1.3,.4,1) both}
.hl-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
@keyframes hlSpin{to{transform:rotate(360deg)}}
@keyframes hlGlow{50%{opacity:.55;transform:scale(.94)}}
@keyframes hlIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.rkcard{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 16px;border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--rkc,#A8E63C) 22%,transparent),transparent 60%),var(--card);border:1px solid var(--line2);cursor:pointer;width:100%;text-align:left;color:inherit}
.rkcard .k{font-size:.68rem;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.rkcard b.rn{font-family:var(--fd);font-size:1.35rem;display:block;line-height:1.1}
.rkb{flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.rkline{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.rkl{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;border:1px solid var(--line)}
.rkl.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.rkl.lock{opacity:.45}
.rkup{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 0}
.rkup .rkb{animation:rkpop 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rkpop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.scanbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);color:var(--ink);cursor:pointer;text-align:left}
.scanbtn .q{width:42px;height:42px;border-radius:13px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div id="splash"><div class="lg" id="spl"></div><b id="spn"></b></div>
<div id="login" class="hide"></div>
<div id="shell" class="hide">
  <header class="top"><div class="in"><div class="brand"><i id="bLogo"></i><b id="gName"></b></div><button class="iconbtn" id="chatB" aria-label="Mesaje"></button><button class="iconbtn" id="bell" aria-label="Notificări"></button></div></header>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Meniu"><span class="ind" id="ind"></span>
    <button data-t="home" data-i="home">Acasă</button>
    <button data-t="train" data-i="dumbbell">Antrenament</button>
    <button data-t="progress" data-i="chart">Progres</button>
    <button data-t="food" data-i="food">Nutriție</button>
    <button data-t="me" data-i="user">Profil</button>
  </nav>
</div>
<script src="core.js?v=3"></script>
<script src="seed.js?v=3"></script>
<script src="env.js?v=3"></script>
<script src="common.js?v=3"></script>
<script src="fig.js?v=3"></script>
<script src="qr.js?v=3"></script>
<script>
let CFG = null, H = null, EX = [], tab = 'home';
const exById = (id) => EX.find((e) => e.id === id) || { id, name: id, muscle: '', steps: [] };
const S = () => CFG.settings;
const TABS = ['home', 'train', 'progress', 'food', 'me'];
$('#spl').innerHTML = '<img src="img/logo.jpg" alt="">'; $('#bLogo').innerHTML = '<img src="img/logo-mark.png" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';
$$('.tabs button').forEach((b) => b.insertAdjacentHTML('afterbegin', IC(b.dataset.i, 24)));
$('#bell').innerHTML = IC('bell', 20); $('#chatB').innerHTML = IC('chat', 20);
const e1rm = (kg, reps) => (kg && reps ? kg * (1 + Math.min(reps, 15) / 30) : 0);
const thumb = (ex) => GymFig.figure(ex, { still: true });

/* ───────── pornire ───────── */
async function boot() {
  const t0 = performance.now();
  CFG = await api('/api/config'); applyAccent(S().accent);
  document.title = S().name; $('#gName').textContent = S().name; $('#spn').textContent = S().name;
  try { H = await api('/api/me'); } catch (e) { if (e.status === 401) { hideSplash(t0); return showLogin(); } throw e; }
  EX = (await api('/api/exercises')).exercises;
  $('#login').classList.add('hide'); $('#shell').classList.remove('hide');
  const h = location.hash.slice(1);
  go(TABS.includes(h) ? h : 'home'); hideSplash(t0);
  if (/^ci-\d{4}$/.test(h)) doCheckin(h.slice(3));
  if (h === 'chat') openChat();
  if (/^ex-\w+$/.test(h)) openExFromQR(h.slice(3));
}
function openExFromQR(id) {
  const e = EX.find((x) => x.id === id); history.replaceState(null, '', '#' + tab);
  if (!e) return toast('Exercițiul nu mai există în aplicație.', 'bad');
  if (tab !== 'train') go('train'); setTimeout(() => openEx(id), 250);
}
function hideSplash(t0) { setTimeout(() => $('#splash').classList.add('out'), Math.max(0, 650 - (performance.now() - t0))); }
function showLogin() {
  $('#shell').classList.add('hide'); const L = $('#login'); L.classList.remove('hide');
  L.innerHTML = `<div class="blobs"><i style="width:340px;height:340px;background:var(--acc);top:-120px;right:-140px;opacity:.28"></i><i style="width:300px;height:300px;background:var(--vio);bottom:-80px;left:-120px;animation-delay:-4s"></i></div>
    <div class="login stagger"><div class="logo"><img src="img/logo.jpg" alt="Logo ${esc(S().name)}"></div><h1>${esc(S().name)}</h1><p class="muted" style="margin:10px 0 26px">${esc(S().tagline || '')}</p>
    <form id="lf"><div class="field"><label for="lp">Telefon</label><input class="input" id="lp" type="tel" inputmode="tel" autocomplete="tel" placeholder="07xx xxx xxx" required></div>
    <div class="field"><label for="lw">Parola</label><input class="input" id="lw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="le"></p><button class="btn btn-acc btn-block" style="padding:15px">Intră în cont ${IC('arrow', 18)}</button></form>
    <p class="muted" style="font-size:.88rem;margin-top:18px">Parola ți-o dă recepția când îți faci abonamentul. ${S().whatsapp ? `<a href="${waLink(S().whatsapp, 'Bună! Am nevoie de ajutor să intru în aplicația sălii.')}" target="_blank" rel="noopener" class="acc">Ai nevoie de ajutor?</a>` : ''}</p>
    <p class="muted" style="font-size:.78rem;margin-top:14px">Folosind aplicația ești de acord cu <a href="confidentialitate.html" class="acc">politica de confidențialitate</a>.</p>
    ${window.GymDemo ? '<p class="tip" style="margin-top:18px">Demo: telefon <b>0740000000</b>, parola <b>1234</b></p>' : ''}</div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); $('#le').textContent = '';
    try { await api('/api/login', { method: 'POST', body: { phone: $('#lp').value, password: $('#lw').value } }); boot(); }
    catch (er) { $('#le').textContent = er.message; }
  };
}
function go(t) {
  tab = TABS.includes(t) ? t : 'home';
  history.replaceState(null, '', '#' + tab);
  $$('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  $('#ind').style.transform = `translateX(${TABS.indexOf(tab) * 100}%)`;
  render(true); scrollTo(0, 0);
}
$$('.tabs button').forEach((b) => (b.onclick = () => go(b.dataset.t)));
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (!H) return; if (/^ci-\d{4}$/.test(h)) return doCheckin(h.slice(3)); if (h === 'chat') return openChat(); if (/^ex-\w+$/.test(h)) return openExFromQR(h.slice(3)); if (TABS.includes(h) && h !== tab) go(h); });
$('#bell').onclick = openNotifs; $('#chatB').onclick = () => openChat();
function render(anim) {
  const v = $('#view'); v.className = 'wrap' + (anim ? ' stagger' : '');
  ({ home: vHome, train: vTrain, progress: vProgress, food: vFood, me: vMe })[tab](v);
  const n = H.unread, c = H.chatUnread;
  $('#bell').innerHTML = IC('bell', 20) + (n ? `<span class="bd">${n}</span>` : '');
  $('#chatB').innerHTML = IC('chat', 20) + (c ? `<span class="bd">${c}</span>` : '');
  countUp(v); GymFig.animate(v); checkRankUp();
}
async function refresh(p) { H = p || (await api('/api/me')); render(); }
const act = async (path, body, method) => { try { const r = await api(path, { method: method || 'POST', body }); if (r && r.me) H = r; return r; } catch (e) { toast(e.message, 'bad'); throw e; } };

/* ───────── ACASĂ ───────── */
function cardHtml() {
  const me = H.me, s = me.subscription, total = s.plan ? s.plan.days : 30, left = s.daysLeft == null ? null : Math.max(0, s.daysLeft);
  const cls = s.state === 'expired' || s.state === 'none' ? 'exp' : s.state === 'expiring' ? 'warn' : '';
  return `<div class="mc3" id="mc" role="button" tabindex="0" aria-label="Cardul de membru. Atinge ca să vezi codul QR."><div class="mc-in">
    <div class="face mc-f ${cls}">
      <div class="mc-top"><span class="mc-logo"><img src="img/logo-mark.png" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></span><b>${esc(S().name)}</b>${chipFor(s)}</div>
      <div class="mc-mid"><div class="grow"><div class="k">Abonament</div><div class="plan">${esc(s.plan ? s.plan.name : 'Fără abonament')}</div><div class="muted small" style="margin-top:4px">${s.end ? (s.state === 'expired' ? 'A expirat pe ' : 'Valabil până pe ') + fdate(s.end, true) : 'Treci pe la recepție'}</div></div>
        ${ring(left == null ? 0 : left / total, left == null ? '–' : `<span data-count="${left}">0</span>`, left === 1 ? 'zi' : 'zile', 96)}</div>
      <div class="mc-bot"><span><span class="nm">${esc(me.name)}</span><br><span class="rkline">${GymFig.rankBadge(me.rank.idx, 16)} ${esc(me.rank.name)}</span></span><span class="mc-hint">${IC('qr', 16)} Cardul tău</span></div>
    </div>
    <div class="face mc-b"><div class="qrbox">${QR.svg(H.memberCode, { size: 150 })}</div><div class="grow"><small>Card de membru</small><b>${esc(me.name)}</b><small>Arată codul la recepție pentru intrare.</small><br><button class="btn btn-sm" id="subD" style="margin-top:10px;background:#0A0A0C;color:#fff">Abonament și plăți</button></div></div>
  </div></div>`;
}
function vHome(v) {
  const me = H.me, d = H.daily, first = me.name.split(' ')[0];
  const hour = new Date().getHours(), hi = hour < 11 ? 'Bună dimineața' : hour < 18 ? 'Salut' : 'Bună seara';
  const prog = H.program, nd = prog ? prog.days[H.nextDay] : null, firstEx = nd ? exById((nd.items.find((i) => !/min/.test(i.reps)) || nd.items[0] || {}).ex) : null;
  const mon = CoreAdd(H.today, -((new Date(H.today + 'T12:00:00').getDay() + 6) % 7)), cal = H.calendar;
  const wdots = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((l, i) => { const k = CoreAdd(mon, i), on = /[wc]/.test(cal[k] || ''); return `<span><i class="${on ? 'on' : ''} ${k === H.today ? 'td' : ''}">${on ? IC('check', 12) : ''}</i>${l}</span>`; }).join('');
  const c = H.crowd, LV = ['Sala e liberă', 'Liniște', 'Moderat', 'Aglomerat'], curH = new Date().getHours(), peak = c.hours.reduce((a, x) => (x.n > a.n ? x : a), { n: -1 });
  const mx = Math.max(1, ...c.hours.map((x) => x.n), c.now);
  const b = H.board, top3 = b.top.slice(0, 3);
  v.innerHTML = `
    <div class="hero-logo"><div class="hl-ring"></div><div class="hl-img"><img src="img/logo.jpg" alt="Logo ${esc(S().name)}"></div></div>
    <div class="hello" style="text-align:center;padding-top:6px"><small>${esc(fday(H.today))}</small><h1>${hi}, ${esc(first)}</h1></div>
    <div>${installBanner()}${cardHtml()}</div>

  v.innerHTML = `<div class="row" style="padding:18px 0 10px;gap:16px"><span class="avatar">${esc(ini)}</span><div class="grow"><h1 style="font-size:1.6rem">${esc(me.name)}</h1><div class="muted">${esc(me.phone)}</div><div style="margin-top:6px">${chipFor(me.subscription)}</div></div></div>
    ${rankCard(me).replace('id="rkC"', 'id="rkP"')}
    <div class="kp" style="margin-top:10px"><div class="st"><b data-count="${me.points.balance}">0</b><small>puncte</small></div><div class="st"><b data-count="${me.badges.filter((b) => b.earned).length}">0</b><small>insigne</small></div><div class="st"><b>${H.board.me && H.board.me.rank ? '#' + H.board.me.rank : '–'}</b><small>în clasament</small></div></div>
    <div class="sec"><h2>Despre mine</h2><button id="ed">Editează</button></div>
    <div class="card"><div class="g2">${[['Obiectiv', me.goal || '–'], ['Greutate dorită', me.targetWeight ? me.targetWeight + ' kg' : '–'], ['Înălțime', me.height ? me.height + ' cm' : '–'], ['Antrenamente/săptămână', me.weekGoal || 3]].map(([k, x]) => `<div><small class="muted" style="font-weight:700">${k}</small><div><b>${esc(x)}</b></div></div>`).join('')}</div></div>
    <div class="sec"><h2>Contul meu</h2></div>
    <div class="menu">
      ${M('sub', 'card', 'Abonament și plăți')}
      ${M('chatM', 'chat', 'Mesaje cu sala', H.chatUnread ? `<span class="chip bad" style="margin-left:auto">${H.chatUnread} noi</span>` : '')}
      ${M('pushT', 'bell', 'Notificări pe telefon', `<span class="toggle ${me.pushOn || LS.get('gymPush') === '1' ? 'on' : ''}"></span>`)}
      ${M('lbT', 'trophy', 'Apar în clasament', `<span class="toggle ${me.hideBoard ? '' : 'on'}"></span>`)}
      ${M('genM', 'spark', 'Antrenor inteligent')}
      ${M('ann', 'megaphone', 'Anunțuri și evenimente')}
      ${M('pw', 'lock', 'Schimbă parola')}
    </div>
    <div class="sec"><h2>Sala</h2></div>
    <div class="menu">
      ${S().whatsapp ? `<a href="${waLink(S().whatsapp, 'Bună! ')}" target="_blank" rel="noopener"><span class="mi">${IC('chat', 18)}</span>WhatsApp<span class="ar">${IC('chev', 18)}</span></a>` : ''}
      ${S().phone ? `<a href="tel:${esc(S().phone.replace(/\s/g, ''))}"><span class="mi">${IC('phone', 18)}</span>${esc(S().phone)}<span class="ar">${IC('chev', 18)}</span></a>` : ''}
      ${S().address ? `<a href="${esc(S().mapsUrl || '#')}" target="_blank" rel="noopener"><span class="mi">${IC('pin', 18)}</span>${esc(S().address)}<span class="ar">${IC('chev', 18)}</span></a>` : ''}
      ${S().instagram ? `<a href="${esc(S().instagram)}" target="_blank" rel="noopener"><span class="mi">${IC('camera', 18)}</span>Instagram<span class="ar">${IC('chev', 18)}</span></a>` : ''}
      ${S().facebook ? `<a href="${esc(S().facebook)}" target="_blank" rel="noopener"><span class="mi">${IC('users', 18)}</span>Facebook<span class="ar">${IC('chev', 18)}</span></a>` : ''}
    </div>
    <a href="confidentialitate.html" class="muted small" style="display:block;text-align:center;margin-top:18px">Politica de confidențialitate</a>
    <button class="btn btn-ghost btn-block" id="out" style="margin-top:12px">${IC('logout', 18)} Ieși din cont</button>`;
  $('#rkP').onclick = openRanks;
  $('#sub').onclick = openSub; $('#ann').onclick = openAnns; $('#chatM').onclick = () => openChat(); $('#genM').onclick = openGen;
  $('#pushT').onclick = togglePush;
  $('#lbT').onclick = async () => { await act('/api/me', { hideBoard: !me.hideBoard }, 'PUT'); toast(H.me.hideBoard ? 'Nu mai apari în clasament' : 'Apari în clasament'); render(); };
  $('#ed').onclick = () => {
    const el = sheet(`<h2>Despre mine</h2><div class="field" style="margin-top:14px"><label for="pn">Nume</label><input class="input" id="pn" value="${esc(me.name)}"></div>
      <div class="field"><label for="pg">Obiectiv</label><select class="input" id="pg">${['Slăbire', 'Slăbire și tonifiere', 'Masă musculară', 'Forță', 'Condiție fizică', 'Sănătate'].map((g) => `<option ${g === me.goal ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
      <div class="g2"><div class="field"><label for="pt">Greutate dorită (kg)</label><input class="input" id="pt" inputmode="decimal" value="${me.targetWeight || ''}"></div><div class="field"><label for="ph">Înălțime (cm)</label><input class="input" id="ph" inputmode="numeric" value="${me.height || ''}"></div>
      <div class="field"><label for="pb">Data nașterii</label><input class="input" id="pb" type="date" value="${me.birth || ''}"></div><div class="field"><label for="px">Sex</label><select class="input" id="px"><option value="">–</option><option value="M" ${me.sex === 'M' ? 'selected' : ''}>Masculin</option><option value="F" ${me.sex === 'F' ? 'selected' : ''}>Feminin</option></select></div></div>
      <div class="field"><label for="pw2">Câte antrenamente pe săptămână vrei?</label><select class="input" id="pw2">${[2, 3, 4, 5, 6].map((n) => `<option ${n === (me.weekGoal || 3) ? 'selected' : ''}>${n}</option>`).join('')}</select></div><p class="err" id="pe"></p><button class="btn btn-acc btn-block" id="ps">Salvează</button>`);
    $('#ps', el).onclick = async () => { try { H = await api('/api/me', { method: 'PUT', body: { name: $('#pn', el).value, goal: $('#pg', el).value, targetWeight: $('#pt', el).value, height: $('#ph', el).value, birth: $('#pb', el).value, sex: $('#px', el).value, weekGoal: $('#pw2', el).value } }); closeSheet(); toast('Salvat'); render(); } catch (e) { $('#pe', el).textContent = e.message; } };
  };
  $('#pw').onclick = () => { const el = sheet(`<h2>Schimbă parola</h2><div class="field" style="margin-top:14px"><label for="o">Parola actuală</label><input class="input" type="password" id="o"></div><div class="field"><label for="n">Parola nouă</label><input class="input" type="password" id="n"></div><p class="err" id="e"></p><button class="btn btn-acc btn-block" id="s">Schimbă</button>`); $('#s', el).onclick = async () => { try { await api('/api/me/password', { method: 'PUT', body: { old: $('#o', el).value, new: $('#n', el).value } }); closeSheet(); toast('Parola a fost schimbată'); } catch (e) { $('#e', el).textContent = e.message; } }; };
  $('#out').onclick = async () => { if (!(await ask('Ieși din cont?', '', 'Ieși', { icon: 'logout' }))) return; await api('/api/logout', { method: 'POST', body: {} }); location.hash = ''; showLogin(); };
}

/* ───────── notificări push + instalare ───────── */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushRow() { return H.me.pushOn ? '' : `<div class="banner" style="margin-top:12px"><span class="bi">${IC('bell', 20)}</span><div class="grow"><b>Primește motivația zilei</b><div class="muted" style="font-size:.84rem">Și anunțuri când îți expiră abonamentul.</div></div><button class="btn btn-acc btn-sm" id="pushOn">Activează</button></div>`; }
function bindPush() { const b = $('#pushOn'); if (b) b.onclick = enablePush; }
async function togglePush() { if (H.me.pushOn || LS.get('gymPush') === '1') { try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && (await reg.pushManager.getSubscription()); if (sub) { await api('/api/me/push', { method: 'DELETE', body: { endpoint: sub.endpoint } }); await sub.unsubscribe(); } } catch {} LS.del('gymPush'); H = await api('/api/me'); toast('Notificările sunt oprite'); render(); } else enablePush(); }
async function enablePush() {
  if (window.GymDemo) { LS.set('gymPush', '1'); window.GymDemo.pushOn(); H = await api('/api/me'); toast('Notificări activate'); closeSheet(); render(); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (ios && !standalone) return sheet(`<h2>Pune aplicația pe ecran</h2><p class="muted">Pe iPhone, notificările merg doar după ce adaugi aplicația pe ecranul principal:</p><ol class="steps"><li>Apasă butonul Partajează jos în Safari</li><li>Alege „Adaugă pe ecranul principal”</li><li>Deschide aplicația de pe ecran și activează notificările</li></ol>`);
  if (!pushSupported() || !CFG.pushKey) return toast('Telefonul tău nu suportă notificări din browser.', 'bad');
  const perm = await Notification.requestPermission(); if (perm !== 'granted') return toast('Ai refuzat notificările. Le poți porni din setările telefonului.', 'bad');
  const reg = await navigator.serviceWorker.ready, key = Uint8Array.from(atob(CFG.pushKey.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - (CFG.pushKey.length % 4)) % 4)), (c) => c.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
  await api('/api/me/push', { method: 'POST', body: { subscription: sub.toJSON() } }); LS.set('gymPush', '1');
  H = await api('/api/me'); closeSheet(); toast('Notificări activate'); render();
}
let deferredInstall = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (tab === 'home' && H) render(); });
function installBanner() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone, ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (standalone || LS.get('gymInstX') || (!deferredInstall && !ios) || (window.GymDemo && window.parent !== window)) return H.me.pushOn ? '' : pushRow();
  return `<div class="banner"><span class="bi">${IC('download', 20)}</span><div class="grow"><b>Pune aplicația pe telefon</b><div class="muted" style="font-size:.84rem">${deferredInstall ? 'O deschizi dintr-o atingere, ca pe orice aplicație.' : 'Apasă Partajează în Safari, apoi „Adaugă pe ecranul principal”.'}</div></div>${deferredInstall ? '<button class="btn btn-acc btn-sm" id="inst">Instalează</button>' : ''}<button class="btn btn-sm" id="instX" aria-label="Închide" style="background:none">${IC('x', 16)}</button></div>`;
}
function bindInstall() {
  if ($('#inst')) $('#inst').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); };
  if ($('#instX')) $('#instX').onclick = () => { LS.set('gymInstX', '1'); render(); };
  bindPush();
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && window.parent === window) navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.GymDemo) window.GymDemoRefresh = () => { if ($('#chat') && window.GymChatReload) { window.GymChatReload(); return; } if (H && !WO && !$('#sheet') && !$('#login:not(.hide)')) refresh().catch(() => {}); };
boot().catch((e) => { $('#splash').classList.add('out'); document.body.insertAdjacentHTML('beforeend', `<div class="login"><h1>Ups</h1><p class="muted">${esc(e.message)}</p><button class="btn btn-acc" onclick="location.reload()">Reîncearcă</button></div>`); });
</script>
</body>
</html>
